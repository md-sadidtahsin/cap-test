name: SonarCloud Python Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd python-service
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          cd python-service
          pytest --cov=app --cov-report=xml:coverage/coverage.xml tests

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=md-sadidtahsin_python-service
            -Dsonar.organization=md-sadidtahsin
            -Dsonar.sources=python-service
            -Dsonar.tests=python-service/tests
            -Dsonar.exclusions=python-service/coverage/**,python-service/**/__pycache__/**,python-service/**/.pytest_cache/**
            -Dsonar.python.coverage.reportPaths=python-service/coverage/coverage.xml
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
